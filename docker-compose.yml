version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockquery-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SUPABASE_DB_PROJECT=${SUPABASE_DB_PROJECT}
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}
      - GLM_API_KEY=${GLM_API_KEY}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stockquery-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
